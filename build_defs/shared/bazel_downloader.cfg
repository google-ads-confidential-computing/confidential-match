# Mitigate 504 Gateway Timeouts from snapshot.debian.org during parallel .deb
# fetches (all .deb downloads are SHA-256 verified against the apt lockfiles):
# 1. Try deb.debian.org (Fastly CDN) first for immutable pool/ .deb files still
#    present in the current Debian or Debian Security archive (including
#    security updates promoted into main pool/ at point releases).
# 2. Fall back to Debian's Cloudflare CDN mirror (snapshot-cloudflare.debian.org)
#    for superseded snapshot versions (where deb.debian.org returns a fast 404).
# 3. Fall back to upstream snapshot.debian.org last.
rewrite snapshot\.debian\.org/archive/debian/[0-9TZ]+/pool/(.*) deb.debian.org/debian/pool/$1
rewrite snapshot\.debian\.org/archive/debian-security/[0-9TZ]+/pool/(.*) deb.debian.org/debian-security/pool/$1
rewrite snapshot\.debian\.org/archive/debian-security/[0-9TZ]+/pool/updates/(.*) deb.debian.org/debian/pool/$1
rewrite snapshot\.debian\.org/(.*) snapshot-cloudflare.debian.org/$1
rewrite snapshot\.debian\.org/(.*) snapshot.debian.org/$1
